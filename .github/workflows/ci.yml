name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Go 测试
        run: go test ./...

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 前端测试
        working-directory: frontend
        run: npm test

      - name: 前端生产构建
        working-directory: frontend
        run: npm run build

      - name: 浏览器 UAT
        working-directory: frontend
        run: npm run test:e2e
